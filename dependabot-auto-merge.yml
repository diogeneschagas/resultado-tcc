name: Dependabot Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Buscar metadados do Dependabot
        uses: dependabot/fetch-metadata@v1
        id: metadata
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Aprovar e fazer merge automático
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.dependency-type == 'direct:development'
        run: |
          gh pr review --approve "${{ github.event.pull_request.number }}" \
            --body "✅ Auto-aprovado: ${{ steps.metadata.outputs.update-type }}"
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comentar PRs de major update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "⚠️ Major update detectado: requer revisão manual"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
